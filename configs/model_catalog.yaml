# Modell-Einstellungen (Key = llama-server --alias = models/<alias>.env).
# Configs können `models:` als Liste von Aliassen angeben -> Einstellungen kommen von hier.
# Sampling: innerhalb eines Paares identisch, zwischen den Familien jeweils die Herstellerempfehlung.
#   Qwen3-Thinking-2507: T 0.6 / top_p 0.95 / top_k 20 (nie temp 0 -> Endlosschleifen)
#   Gemma 4:             T 1.0 / top_p 0.95 / top_k 64
# Gemma 4: Thinking ist standardmäßig aus und wird mit <|think|> am Anfang des System-Prompts fest eingeschaltet.
# max_tokens: leer = thinking.budget + thinking.answer_reserve aus der Experiment-Config (Notbremse).
models:
  # --- Kern: Qwen ---------------------------------------------------------------
  qwen3-30b-a3b-thinking:
    family: qwen
    variant: original
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
  qwen3-30b-a3b-thinking-abliterated:
    family: qwen
    variant: abliterated
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
  # --- Kern: Gemma --------------------------------------------------------------
  gemma-4-26b-a4b:
    family: gemma
    variant: original
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    system_prefix: "<|think|>"
  gemma-4-26b-a4b-abliterated:
    family: gemma
    variant: abliterated
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    system_prefix: "<|think|>"
  # --- Optional: Größenvergleich innerhalb von Qwen (Entwicklung/Pilot auf Mac und Jetson) ---
  qwen3-4b-thinking:
    family: qwen-4b
    variant: original
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
  qwen3-4b-thinking-abliterated:
    family: qwen-4b
    variant: abliterated
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
