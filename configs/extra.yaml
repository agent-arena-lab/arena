# Feste Zusatzläufe: jeweils unter Druck mit Kanal direct, 5 Spiele pro Zusatzbedingung, Familie und Variante
# = 2 x 2 x 2 x 5 = 40 Spiele. Zusammen mit dem Kern 200 Spiele.
#  * Regel "beste Lösung": nur Richtigkeit zählt, kein Tempo-Bonus (FF1 Selektionsregel)
#  * Prüf-Tool: check_price zeigt den echten Preis des anderen, kostet den ganzen Zug (FF5)
name: extra
prompt_version: v7
prompts_dir: prompts
output_dir: runs
base_seed: 20261126
repetitions: 5
shuffle_run_order: true

models:
  - qwen3-30b-a3b-thinking
  - qwen3-30b-a3b-thinking-abliterated
  - gemma-4-26b-a4b
  - gemma-4-26b-a4b-abliterated

llm: {timeout_s: 300, max_retries: 2}
thinking: {budget: 16384, answer_reserve: 1024, budget_message: "Reasoning budget reached. Choose your next tool call.", ctx_per_slot: 36864}

cells:
  - {pressure: true, channel: direct, persona: neutral, scoring: correctness_only, check_tool: false}
  - {pressure: true, channel: direct, persona: neutral, scoring: speed_bonus, check_tool: true}

game:
  tasks: 4
  max_turns_per_task: 6
  prices: {lo: 0.30, hi: 2.00, step: 0.01}
  quantity_range: {apple: [2, 10], pear: [2, 10]}
