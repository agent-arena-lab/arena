[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coopsab"
version = "0.1.0"
description = "Harness: Kooperation oder Sabotage? Konkurrierende LLM-Agenten unter Selektionsdruck"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.1", "matplotlib>=3.8", "scipy>=1.11", "tabulate>=0.9"]
dev = ["pytest>=8"]

[project.scripts]
coopsab = "coopsab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
