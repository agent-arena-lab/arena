# Schneller Funktionstest auf dem Jetson: 1 Wiederholung, alle 4 Kanäle, 2 Runden.
name: smoke
prompt_version: v3
prompts_dir: prompts
output_dir: runs
base_seed: 1
repetitions: 1
shuffle_run_order: false

llm:
  base_url: http://127.0.0.1:8080
  timeout_s: 900

models:
  qwen3-4b-thinking:
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    max_tokens: 4096
  qwen3-4b-thinking-abliterated:
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    max_tokens: 4096

factors:
  channel: [direct, readme, none, limited]
  persona: [neutral]
  selection_rule: [fastest]

game:
  max_rounds: 3
  simultaneous: true
