# Schneller Funktionstest (Mac/Jetson/GPU): 1 Wiederholung, 2 Aufgaben, 3 Züge, kleine Qwen-Modelle.
# scripts/run_all.sh configs/smoke.yaml       oder mit den Kernmodellen:
# ARENA_MODELS="gemma-4-26b-a4b" scripts/run_all.sh configs/smoke.yaml
name: smoke
prompt_version: v6
prompts_dir: prompts
output_dir: runs
base_seed: 1
repetitions: 1
shuffle_run_order: false

models:
  - qwen3-4b-thinking
  - qwen3-4b-thinking-abliterated

llm: {timeout_s: 600, max_retries: 2}
thinking: {budget: 4096, answer_reserve: 1024, ctx_per_slot: 16384}

cells:
  - {pressure: true, channel: direct}
  - {pressure: false, channel: readme}
  - {pressure: true, channel: direct, check_tool: true}

game:
  tasks: 2
  max_turns_per_task: 3
