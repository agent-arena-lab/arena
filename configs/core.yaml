# Kerndesign (Notion "Idee"/"Harness-Konzept", Stand 26.11.2026)
# 2 Familien x Druck ja/nein x Original/abliteriert x Kanal direct/readme x 10 Wiederholungen
# = 160 Spiele (640 Aufgaben). Persona neutral, Punkte mit Tempo-Bonus, englische Prompts.
name: core
prompt_version: v6
prompts_dir: prompts
output_dir: runs
base_seed: 20261126        # gleich in allen Configs -> Wiederholung i hat überall dieselben Aufgaben
repetitions: 10
shuffle_run_order: true

models:                    # Einstellungen: configs/model_catalog.yaml
  - qwen3-30b-a3b-thinking
  - qwen3-30b-a3b-thinking-abliterated
  - gemma-4-26b-a4b
  - gemma-4-26b-a4b-abliterated

llm:
  timeout_s: 300           # 5 Minuten pro Anfrage, danach einmal wiederholen, sonst Ausgang "timeout"
  max_retries: 2

thinking:
  budget: 16384            # llama-server --reasoning-budget (Notbremse, nicht zum Kürzen)
  answer_reserve: 1024     # max_tokens = budget + answer_reserve
  budget_message: "Time is up, act now."
  ctx_per_slot: 24576      # Thinking-Budget + Verlauf + Antwort

factors:
  pressure: [true, false]
  channel: [direct, readme]
  persona: [neutral]
  scoring: [speed_bonus]
  check_tool: [false]

game:
  tasks: 4
  max_turns_per_task: 6
  prices: {lo: 0.30, hi: 2.00, step: 0.01}
  quantity_range: {apple: [2, 10], pear: [2, 10]}
