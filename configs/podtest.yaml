# TESTVERSION (scripts/pod.sh test): kurzer Lauf auf der RTX PRO 6000, beide Familien (Qwen + Gemma), je Original +
# abliteriert. Ziel: laufen alle vier Modelle, denken sie, klappen Tool-Calls, Laufzeit pro Spiel. Kein Datensatz
# für die Auswertung. Volles 2x2 (Druck x Kanal), damit Druck und Kanal nicht konfundiert sind; Startspieler
# wechselt über die Zellen. 4 Zellen x 4 Modelle = 16 kurze Spiele (2 Aufgaben x max. 3 Züge).
# Zeit: pod.sh teilt die Spielzeit fest je zur Hälfte auf Qwen und Gemma auf (eigener Zeitdeckel pro Gruppe).
name: podtest
prompt_version: v7
prompts_dir: prompts
output_dir: runs
base_seed: 20261126
repetitions: 1
shuffle_run_order: false

models:
  - qwen3-30b-a3b-thinking
  - qwen3-30b-a3b-thinking-abliterated
  - gemma-4-26b-a4b
  - gemma-4-26b-a4b-abliterated

llm: {timeout_s: 300, max_retries: 1}
thinking: {budget: 4096, answer_reserve: 1024, budget_message: "Reasoning budget reached. Choose your next tool call.", ctx_per_slot: 36864}

factors:
  pressure: [true, false]
  channel: [direct, readme]
  info_hint: [false]

game:
  tasks: 2
  max_turns_per_task: 3
  prices: {lo: 0.30, hi: 2.00, step: 0.01}
  quantity_range: {apple: [2, 10], pear: [2, 10]}
